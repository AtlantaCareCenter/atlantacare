# Sveltia CMS configuration — the editing UI at /admin/
#
# Production: set `repo` to the clinic's GitHub repository and `base_url` to the
# tiny auth worker (see README "Going live"). Locally, open http://localhost:8171/admin/
# in Chrome/Edge and choose "Work with Local Repository" — no login needed.

backend:
  name: github
  repo: AtlantaCareCenter/atlantacare
  branch: main
  base_url: https://atlantacare-sveltia-cms-auth.cloudflare-com-cc6.workers.dev

site_url: https://www.atlantacare.com
display_url: https://www.atlantacare.com
logo_url: /images/logo.png

media_folder: public/images
public_folder: /images

# Don't write unused optional fields as null/'' into the content files
output:
  omit_empty_optional_fields: true

# ---------------------------------------------------------------------------
# Reusable field definitions
# ---------------------------------------------------------------------------
_templates:
  button_label: &btn_label
    { label: Button text, name: button_label, widget: string, required: false,
      hint: "Leave blank for no button." }
  callout_button_label: &cta_label
    { label: Button text, name: button_label, widget: string, required: false,
      hint: "Leave blank to show “Book Now”." }
  button_url: &btn_url
    { label: Button link, name: button_url, widget: string, required: false,
      hint: "Leave blank to use the online booking link from Site Settings." }

_section_types: &section_types
  - label: Call to action
    name: callout
    summary: "{{fields.heading}}"
    fields:
      - { label: Heading, name: heading, widget: text,
          hint: "One phrase per line. **bold** for bold, *italic* for the handwriting style." }
      - { label: Text under heading, name: text, widget: markdown, required: false, minimal: true }
      - *cta_label
      - *btn_url
  - label: Text block
    name: text
    summary: "{{fields.body | truncate(60)}}"
    fields:
      - { label: Text, name: body, widget: markdown }
      - { label: Background photo, name: background_image, widget: image, required: false,
          hint: "Optional. Adds a wide photo behind the text (text sits on the right)." }
      - { label: Show lists in 3 columns, name: columns, widget: select, required: false,
          options: [{ label: "No", value: 1 }, { label: "Yes", value: 3 }] }
      - *btn_label
      - *btn_url
  - label: Two columns
    name: two_column
    summary: "Two columns"
    fields:
      - { label: Left text, name: left, widget: markdown, required: false }
      - { label: Left image (instead of text), name: left_image, widget: image, required: false }
      - { label: Left image description, name: left_image_alt, widget: string, required: false }
      - { label: Right text, name: right, widget: markdown, required: false }
      - { label: Right image (instead of text), name: right_image, widget: image, required: false }
      - { label: Right image description, name: right_image_alt, widget: string, required: false }
  - label: Photo + text rows
    name: cards
    summary: "{{fields.items.length}} rows"
    fields:
      - label: Rows
        name: items
        widget: list
        summary: "{{fields.title}}"
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Text, name: text, widget: markdown, minimal: true, required: false }
          - { label: Photo, name: image, widget: image, required: false }
          - { label: Photo description, name: image_alt, widget: string, required: false }
          - { label: Link text, name: link_label, widget: string, required: false, default: Learn More }
          - { label: Link, name: link_url, widget: string, required: false }
  - label: Questions & answers
    name: faq
    summary: "{{fields.items.length}} questions"
    fields:
      - label: Questions
        name: items
        widget: list
        summary: "{{fields.question}}"
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: markdown, minimal: true }
  - label: Contact details (phone, address, hours)
    name: contact_info
    summary: "Phone, address and hours from Site Settings"
    fields:
      - { label: Note, name: enabled, widget: hidden, default: true }

_page_fields: &page_fields
  - { label: Page title (banner), name: title, widget: string }
  - { label: Headline, name: heading, widget: string, required: false }
  - { label: Intro paragraph(s), name: body, widget: markdown, required: false }
  - { label: Search engine description, name: description, widget: string, required: false,
      hint: "One sentence shown in Google results." }
  - { label: Menu order, name: order, widget: number, required: false, value_type: int }
  - label: Page sections
    name: sections
    widget: list
    typeKey: _template
    types: *section_types

# ---------------------------------------------------------------------------
collections:
  - name: settings
    label: Site Settings
    icon: settings
    files:
      - name: site
        label: Contact info, hours & menu
        file: src/content/singles/site.yml
        icon: contact_phone
        fields:
          - { label: Phone, name: phone, widget: string }
          - { label: Address, name: address, widget: text, hint: "One line per row." }
          - { label: Map link, name: map_url, widget: string }
          - { label: Online booking link, name: booking_url, widget: string }
          - { label: Patient portal link, name: portal_url, widget: string }
          - label: Appointment hours
            name: hours
            widget: list
            summary: "{{fields.days}}: {{fields.hours}}"
            fields:
              - { label: Day(s), name: days, widget: string }
              - { label: Hours, name: hours, widget: string }
          - { label: Note under hours, name: hours_note, widget: string, required: false }
          - { label: Footer paragraph, name: footer_blurb, widget: text }
          - { label: Services disclaimer (footer), name: disclaimer, widget: markdown, minimal: true }
          - label: Documents (PDFs)
            name: documents
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: File, name: file, widget: file, media_folder: public/docs, public_folder: /docs }
          - label: Menu
            name: nav
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: url, widget: string, required: false, hint: "e.g. /about/ — leave blank for a heading with sub-items only" }
              - label: Sub-items
                name: children
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: url, widget: string }
          - { label: Site name, name: name, widget: string }
          - { label: Tagline (browser tab), name: tagline, widget: string }
      - name: home
        label: Home page
        file: src/content/singles/home.yml
        icon: home
        fields:
          - label: Top banner
            name: hero
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Handwritten word, name: script_heading, widget: string }
              - { label: Text, name: text, widget: string }
              - { label: Photo, name: image, widget: image }
              - *btn_label
              - *btn_url
          - label: Second section
            name: intro
            widget: object
            fields:
              - { label: Heading, name: heading, widget: text, hint: "**bold**, *handwriting*" }
              - { label: Photo, name: image, widget: image }
              - *btn_label
              - *btn_url
          - label: Services section
            name: services
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Handwritten word, name: script_heading, widget: string }
              - { label: Background photo, name: background_image, widget: image }
              - label: Service circles
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Icon (shown on hover), name: icon, widget: image }
                  - { label: Link, name: url, widget: string }
              - *btn_label
              - *btn_url
          - label: Bottom call to action
            name: callout
            widget: object
            fields:
              - { label: Heading, name: heading, widget: text }
              - { label: Text, name: text, widget: markdown, minimal: true, required: false }
              - *cta_label
              - *btn_url
          - { label: Search engine description, name: description, widget: string, required: false }

  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "{{slug}}/"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields: *page_fields

  - name: services
    label: Service pages
    label_singular: Service page
    icon: medical_services
    folder: src/content/pages/services
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "services/{{slug}}/"
    summary: "{{title}}"
    fields: *page_fields

  - name: womens_health
    label: Women's Health pages
    label_singular: Women's Health page
    icon: favorite
    folder: src/content/pages/womens-health
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "womens-health/{{slug}}/"
    summary: "{{title}}"
    fields: *page_fields
