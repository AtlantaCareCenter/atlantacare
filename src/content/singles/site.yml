footer_blurb: Since 1982, women have relied on the expertise of Atlanta Care Center to guide them through the uncertainty of an unplanned pregnancy. Through our free services, we empower women to make informed choices about their pregnancy.
disclaimer: |-
  Atlanta Care Center does not offer annual exams, birth control, abortion services or referrals, prenatal and postnatal care, infertility treatments, or treatment for reproductive tract infections. Atlanta Care Center will offer referrals to local physicians for prenatal care. Medical services are provided in accordance with all applicable laws, and in accordance with pertinent medical standards, under the supervision and direction of a licensed physician. Patient information is held in strict and absolute confidence in accordance with our [Notice of Privacy Policy](/docs/notice-of-privacy-practices.pdf). Releases and permissions are obtained appropriately. Patient information is only disclosed as required by law and when necessary to protect the patient or others against imminent harm.

  For information about how Atlanta Care Center protects your privacy when you are visiting our website, see our [Website Privacy Policy](/docs/website-privacy-policy.pdf).
